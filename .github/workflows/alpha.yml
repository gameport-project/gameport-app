name: Alpha

# Builds a signed APK of any branch and puts it on a GitHub PRE-RELEASE, to hand a link to a tester.
#
# The app asks GitHub for "releases/latest", which never returns a pre-release, so an alpha is never offered as an update.
# The tag starts with "alpha-", never "v", so the Release workflow (tags "v*") does not react to it either.
# An alpha touches no file of the repository: no version, no notes, no patch generation, no announcement.
#
# Actions > Alpha > Run workflow, choosing the branch. The link of the APK is printed at the end of the run.
# Delete the pre-release (and its tag) from the Releases page when the test is over.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    # Same signing key as a release (the alpha installs over a release), handed over through the same protected environment.
    environment: release
    env:
      TAG: alpha-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the signing key is there
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set in the repository secrets"; exit 1; }
      - name: Build
        run: ./gradlew assembleRelease --stacktrace
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          unsigned="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "GamePort-${TAG}.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="GamePort-${TAG}.apk"
          {
            echo "Test build of the branch \`${GITHUB_REF_NAME}\` (commit \`${GITHUB_SHA::7}\`). Not a release."
            echo
            echo "**SHA-256 of the APK:** \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "GamePort alpha ${{ github.run_number }}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${apk}" | tee -a "$GITHUB_STEP_SUMMARY"
